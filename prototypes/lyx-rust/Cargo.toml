[package]
name = "lyx-typst-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lyx-typst-demo"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-syntax = { path = "../typst-engine/crates/typst-syntax" }

[build-dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.dev]
debug = 0
