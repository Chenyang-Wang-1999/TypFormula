[package]
name = "lyx-typst-layout-adapter"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"

# prepare.ps1 materializes one pinned engine shared by all prototypes.
# Keeping the adapter separate prevents compiler/layout dependencies entering WASM.
[dependencies]
typst = { path = "../../typst-engine/crates/typst" }
typst-eval = { path = "../../typst-engine/crates/typst-eval" }
typst-layout = { path = "../../typst-engine/crates/typst-layout" }
typst-svg = { path = "../../typst-engine/crates/typst-svg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[workspace]
