[package]
name = "multi-formula-context"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "multi-formula-demo"
path = "src/main.rs"

[dependencies]
typst = { path = "../typst-engine/crates/typst" }
typst-syntax = { path = "../typst-engine/crates/typst-syntax" }
typst-layout = { path = "../typst-engine/crates/typst-layout" }
typst-svg = { path = "../typst-engine/crates/typst-svg" }
typst-kit = { path = "../typst-engine/crates/typst-kit", features = ["embedded-fonts", "scan-fonts", "datetime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
