[package]
name = "typformula-layout"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later"

# The pinned engine and mapping changes are checked in under vendor/typst.
# The adapter stays its own crate so the editor core never links the compiler.
[dependencies]
typst = { path = "../vendor/typst/crates/typst" }
typst-eval = { path = "../vendor/typst/crates/typst-eval" }
typst-layout = { path = "../vendor/typst/crates/typst-layout" }
typst-svg = { path = "../vendor/typst/crates/typst-svg" }
typst-pdf = { path = "../vendor/typst/crates/typst-pdf" }
typst-kit = { path = "../vendor/typst/crates/typst-kit", features = ["scan-fonts", "embedded-fonts", "datetime"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[workspace]

