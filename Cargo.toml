[package]
name = "visual-typst"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "visual_typst_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "visual-typst"
path = "src/main.rs"
required-features = ["server"]

[features]
server = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-syntax = { path = "vendor/typst/crates/typst-syntax" }

[build-dependencies]
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.dev]
debug = 0


[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.flate2]
version = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tar]
version = "0.4"
