[package]
name = "visual-typst"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "visual_typst_core"
crate-type = ["rlib"]

[[bin]]
name = "visual-typst"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst-syntax = { path = "vendor/typst/crates/typst-syntax" }
url = "2"
ureq = "3"
flate2 = "1"
tar = "0.4"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.dev]
debug = 0
