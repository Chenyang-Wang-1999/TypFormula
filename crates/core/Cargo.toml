[package]
name = "typformula-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false
description = "The TypFormula editing kernel: model, declarations, parser and writer"

# The kernel is the half a frontend is written against, so it must not be able to
# reach a transport, a process or the network. Only `typst-syntax` is needed from
# Typst itself; the compiler proper stays behind `native-adapter`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One `Char` is one grapheme cluster, which is the unit the Typst lexer keeps
# together and the unit `GlyphItem` holds. Typst already depends on this, so the
# kernel gains no new code in the build, only a name it can use.
unicode-segmentation = "1"
typst-syntax = { path = "../../vendor/typst/crates/typst-syntax" }

# `build.rs` turns `config/symbols.json` into the symbol table `typst.rs`
# includes, and reads `config/commands.json`. `serde` itself is needed for the
# derive on the command entry, which may be a bare shape name or an object.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
